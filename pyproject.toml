[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnmtool"
version = "1.0.1"
description = "A powerful, zero-dependency cross-platform CLI file renaming utility"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["rename", "cli", "files", "batch", "utility", "tool", "terminal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]

[project.scripts]
rnmtool = "rnmtool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/AayushGoswami/rnmtool"
"Bug Tracker" = "https://github.com/AayushGoswami/rnmtool/issues"
Changelog = "https://github.com/AayushGoswami/rnmtool/blob/main/CHANGELOG.md"
